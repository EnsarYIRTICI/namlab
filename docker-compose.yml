name: namlab

services:
  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Sadece loopback: host'taki nginx erişir, dışarıdan görünmez. namtag 3000, naman 3100, namrec 3200 kullanıyor.
      - "127.0.0.1:${WEB_PORT:-3300}:3000"
    networks: [internal]

  api:
    build:
      context: ./api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-namlab}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}@db:5432/${POSTGRES_DB:-namlab}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN .env içinde tanımlı olmalı (örn. https://namlab.ornek.com)}
      TRUST_PROXY: "1"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-7}
    ports:
      - "127.0.0.1:${API_PORT:-4300}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-namlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: ${POSTGRES_DB:-namlab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-namlab} -d ${POSTGRES_DB:-namlab}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]   # port yayınlanmaz

networks:
  internal:

volumes:
  pgdata:
