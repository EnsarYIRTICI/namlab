# Host'taki nginx: /etc/nginx/sites-available/namlab.xenny.cloud
#   ln -s /etc/nginx/sites-available/namlab.xenny.cloud /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Wildcard sertifika (xenny.cloud) zaten var (naman/namtag/namrec ile aynı).
# .env içindeki APP_ORIGIN bu alan adıyla (https://...) aynı olmalı.
# Kamera tarayıcıda SADECE HTTPS'te açılır.

server {
    listen 80;
    server_name namlab.xenny.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name namlab.xenny.cloud;

    ssl_certificate     /etc/letsencrypt/live/xenny.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xenny.cloud/privkey.pem;

    # Ürün listesi içe aktarma (on binlerce satır JSON olarak gelir; API sınırı 25 MB)
    client_max_body_size 30m;

    # API doğrudan Express'e
    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # istemcinin gönderdiği başlığı ezer (sahtecilik önlemi)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arayüz Next.js'e (barkod okuyucunun wasm dosyası dahil)
    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
